version: '3.8'

services:
  web:
    image: php:8.2-apache
    container_name: php_app
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    command: sh -c "docker-php-ext-install mysqli && apache2-foreground"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meu_banco
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_local
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  mysql_data:

